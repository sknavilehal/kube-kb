services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kube-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kube_kb
      POSTGRES_PASSWORD: kube_kb
      POSTGRES_DB: kube_kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kube_kb -d kube_kb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
